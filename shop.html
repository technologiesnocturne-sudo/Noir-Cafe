<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — Noir Cafe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="shortcut icon" href="/images/nclogo.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..500&family=Work+Sans:wght@300;400;500&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <div class="nclogo" id="nclogo">
      <img src="/images/nclogo.png" alt="Noir Cafe logo" class="noirlogo">
    </div>
    <a class="logo" href="index.html">Noir<span>.</span>Cafe</a>
    <div class="nav-links" id="nav-links">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="#" data-auth-link>Login</a>
      <a href="admin/index.html" data-admin-link style="display:none;">Admin</a>
      <a class="nav-cart" href="cart.html">Cart <span class="nav-cart-count" data-cart-count>0</span></a>
    </div>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
  </div>
</nav>

<main>
  <div class="container">
    <div class="page-header">
      <span class="eyebrow">The menu</span>
      <h1>Shop</h1>
    </div>

    <div style="display:flex; gap:16px; align-items:center; margin-bottom:20px; flex-wrap:wrap;">
      <input
        id="search-input"
        type="search"
        placeholder="Search beans, drinks, pastries…"
        style="flex:1; min-width:220px; background:var(--espresso-2); border:1px solid var(--line); border-radius:var(--radius); padding:11px 14px; color:var(--parchment); font-family:var(--font-body); font-size:0.95rem;">
    </div>

    <div class="filters" id="filters">
      <button class="chip active" data-cat="">All</button>
    </div>

    <div class="grid" id="product-grid">
      <p class="muted">Loading the menu…</p>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">
      <span>© <span data-year></span> Noir Cafe</span>
      <span>Payments secured by Paystack · GHS</span>
    </div>
  </div>
</footer>

<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script src="js/shop.js"></script>
</body>
</html>
