<!DOCTYPE html>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <div class="nclogo" id="nclogo">
      <img src="/Noir_Cafe/images/nclogo.png" alt="Noir Cafe logo" class="noirlogo">
    </div>
    <a class="logo" href="index.html">Noir<span>.</span>Cafe</a>
    <div class="nav-links" id="nav-links">
      <a href="index.html">Home</a>

  </div>
</nav>

<main>

      <div>
        <span class="eyebrow">Welcome back</span>
        <h1 id="account-name">…</h1>

    <div id="order-list"><p class="muted"><span class="spinner"></span> Loading your orders…</p></div>
  </div>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">
      <span>© <span data-year></span> Noir Cafe</span>
      <span>Payments secured by Paystack · GHS</span>
    </div>
  </div>
</footer>

<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
